<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="Pet Angels SA — community, marketplace, rescue and adoption at petangelssa.co.za. Care nearby, Shelter Map, and payments with RedFace Pay."
    />
    <meta name="theme-color" content="#2F5D50" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pet Angels SA" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="canonical" href="https://app.petangelssa.co.za/" />
    <title>Pet Angels SA</title>
    <script>
      (function () {
        var h = location.hostname.replace(/^www\./, '');
        var canonical = document.querySelector('link[rel="canonical"]');
        if (h === 'petangelssa.co.za') {
          if (canonical) canonical.setAttribute('href', 'https://petangelssa.co.za/');
          document.title = 'Pet Angels SA';
        } else if (h === 'app.petangelssa.co.za') {
          document.title = 'Pet Angels SA · app';
        }
      })();
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5404460804585956"
      crossorigin="anonymous"
      id="pa-adsense"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
